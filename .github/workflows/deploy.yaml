name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS: 'false'
      - name: Verify local generator
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const pkg = require('ergogen/package.json');
          assert.equal(pkg.name, '@runinit/ergogen');
          assert.equal(pkg.version, '6.0.0-develop');
          JS
      - run: pnpm run test:release
      - run: pnpm run precommit
      - run: git diff --exit-code
      - run: pnpm run build
        env:
          VITE_GTAG_ID: ${{ vars.REACT_APP_GTAG_ID || vars.VITE_GTAG_ID }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results
          retention-days: 7
      - name: Prepare Pages routing
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check
    if: (github.repository == 'runinit/ergogen-gui' || github.repository == 'runinit/ergogen-gui-preview') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
